name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # PAT(TONE_FIX_CI)를 쓰는 이유: GITHUB_TOKEN 으로 머지한 푸시는 새 워크플로우를
      # 실행하지 않아 태그와 Release 생성 단계가 돌지 않는다.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.TONE_FIX_CI }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 릴리스 PR 이 만들어지면 바로 rebase 머지한다. 머지 푸시가 이 워크플로우를 다시 실행해 Release 를 만든다.
      # 릴리스 PR 은 커밋이 하나뿐이라 rebase 머지 결과는 release-please 가 만든 커밋 그대로 main 에 올라간다.
      - name: Merge release PR
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.TONE_FIX_CI }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        # fromJSON() 을 env 에서 쓰면 PR 이 없는 실행에서 빈 문자열을 파싱하다 템플릿 오류가 나므로 셸에서 jq 로 파싱한다.
        run: |
          PR_NUMBER=$(jq -r '.number' <<<"$PR_JSON")
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --rebase --delete-branch
